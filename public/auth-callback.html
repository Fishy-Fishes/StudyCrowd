<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyCrowd Authentication</title>
  <style>
    body {
      background-color: #426558;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #1A2918;
      padding: 32px 28px;
      border-radius: 20px;
      max-width: 360px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h2 {
      margin: 0 0 12px;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    p {
      margin: 0 0 20px;
      font-size: 14px;
      color: #CBC0C0;
      line-height: 1.5;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #8DB194;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-block;
      background-color: #8DB194;
      color: #1A2918;
      font-weight: bold;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      margin-top: 18px;
      font-size: 14px;
    }
  </style>
  <script>
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);

      // Forward every query parameter (code, state, error, ...) to the app
      // using the custom scheme the app registers (studycrowd://).
      const forwarded = [];
      urlParams.forEach(function(value, key) {
        forwarded.push(encodeURIComponent(key) + '=' + encodeURIComponent(value));
      });
      const appUrl = 'studycrowd://oauth-callback' +
        (forwarded.length > 0 ? '?' + forwarded.join('&') : '');

      // The button is a user gesture, which browsers always allow to hand
      // off to an external app; show it immediately.
      const btn = document.getElementById('manual-btn');
      if (btn) {
        btn.href = appUrl;
        btn.style.display = 'inline-block';
      }

      // Best-effort automatic hand-off.
      window.location.href = appUrl;
    };
  </script>
</head>
<body>
  <div class="card">
    <h2>StudyCrowd</h2>
    <p>Authorizing with Discord...<br>Returning you to the app.</p>
    <div class="spinner"></div>
    <a id="manual-btn" class="btn" style="display: none;" href="#">Return to App</a>
  </div>
</body>
</html>
